appId: com.billflow.desktop
productName: BillFlow
copyright: "Copyright © 2026 Akatsuki-61"
directories:
  output: release
  buildResources: build
files:
  - dist-electron/**/*
  - out/**/*
  - package.json
  - "!dist-electron/**/*.map"
  - "!node_modules/better-sqlite3/{deps,src,build}/**/*"
  - "!node_modules/better-sqlite3/binding.gyp"
  - "!node_modules/node-addon-api/**/*"
asar: true
npmRebuild: true
asarUnpack:
  - "**/node_modules/better-sqlite3/**"
extraResources:
  - from: build/THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt
  - from: build/icon.png
    to: brand/icon.png
  - from: public/brand/logo-white.png
    to: brand/logo-white.png
  - from: build/tray
    to: brand/tray
  - from: drizzle
    to: drizzle
win:
  files:
    - dist-electron/**/*
    - out/**/*
    - package.json
    - "!dist-electron/**/*.map"
    - "!node_modules/better-sqlite3/{deps,src,build}/**/*"
    - "!node_modules/better-sqlite3/binding.gyp"
    - "!node_modules/node-addon-api/**/*"
    - "!node_modules/better-sqlite3/prebuilds/!(win32-${arch}).node"
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: BillFlow
  include: build/installer.nsh
mac:
  files:
    - dist-electron/**/*
    - out/**/*
    - package.json
    - "!dist-electron/**/*.map"
    - "!node_modules/better-sqlite3/{deps,src,build}/**/*"
    - "!node_modules/better-sqlite3/binding.gyp"
    - "!node_modules/node-addon-api/**/*"
    - "!node_modules/better-sqlite3/prebuilds/!(darwin-${arch}).node"
  icon: build/icon.icns
  target:
    - dmg
  category: public.app-category.finance
dmg:
  title: "BillFlow ${version}"
  icon: build/icon.icns
  background: build/dmg-background.png
  iconSize: 104
  iconTextSize: 12
  contents:
    - x: 175
      y: 232
    - x: 485
      y: 232
      type: link
      path: /Applications
