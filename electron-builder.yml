appId: com.billflow.desktop
productName: BillFlow
copyright: "Copyright © 2026 Akatsuki-61"
directories:
  output: release
  buildResources: build
files:
  - dist-electron/**/*
  - out/**/*
  - package.json
asar: true
asarUnpack:
  - "**/node_modules/better-sqlite3/**"
extraResources:
  - from: build/icon.png
    to: brand/icon.png
  - from: public/brand/logo-white.png
    to: brand/logo-white.png
  - from: build/tray
    to: brand/tray
  - from: drizzle
    to: drizzle
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: BillFlow
mac:
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.finance
