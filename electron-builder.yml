appId: com.billflow.desktop
productName: BillFlow
copyright: "Copyright © 2026 Akatsuki-61"
electronLanguages:
  - en
  - en-US
directories:
  output: release
  buildResources: build
files:
  - dist-electron/**/*
  - out/**/*
  - package.json
  - "!dist-electron/**/*.map"
  - "!node_modules/better-sqlite3/{deps,src,build}/**/*"
  - "!node_modules/better-sqlite3/binding.gyp"
  - "!node_modules/node-addon-api/**/*"
  - "!node_modules/onnxruntime-web/**/*"
  - "!node_modules/@huggingface/transformers/{src,types}/**/*"
  - "!node_modules/@huggingface/transformers/dist/transformers.web.*"
  - "!node_modules/@huggingface/transformers/dist/*.map"
  - "!node_modules/onnxruntime-node/bin/napi-v6/linux/**/*"
  - "!node_modules/onnxruntime-node/script/**/*"
  - "!node_modules/tesseract.js-core/tesseract-core.js"
  - "!node_modules/tesseract.js-core/tesseract-core.wasm*"
  - "!node_modules/tesseract.js-core/tesseract-core-simd.js"
  - "!node_modules/tesseract.js-core/tesseract-core-simd.wasm*"
  - "!node_modules/tesseract.js-core/tesseract-core-relaxedsimd.js"
  - "!node_modules/tesseract.js-core/tesseract-core-relaxedsimd.wasm*"
  - "!node_modules/tesseract.js-core/*-lstm.wasm.js"
asar: true
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
npmRebuild: true
asarUnpack:
  - "**/node_modules/better-sqlite3/**"
  - "**/node_modules/onnxruntime-node/**"
  - "**/node_modules/tesseract.js/**"
  - "**/node_modules/tesseract.js-core/**"
extraResources:
  - from: build/THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt
  - from: build/icon.png
    to: brand/icon.png
  - from: public/brand/logo-white.png
    to: brand/logo-white.png
  - from: build/tray
    to: brand/tray
  - from: drizzle
    to: drizzle
  - from: assets/ai-models
    to: ai-models
win:
  files:
    - dist-electron/**/*
    - out/**/*
    - package.json
    - "!dist-electron/**/*.map"
    - "!node_modules/better-sqlite3/{deps,src,build}/**/*"
    - "!node_modules/better-sqlite3/binding.gyp"
    - "!node_modules/node-addon-api/**/*"
    - "!node_modules/better-sqlite3/prebuilds/!(win32-${arch}).node"
    - "!node_modules/onnxruntime-web/**/*"
    - "!node_modules/@huggingface/transformers/{src,types}/**/*"
    - "!node_modules/@huggingface/transformers/dist/transformers.web.*"
    - "!node_modules/@huggingface/transformers/dist/*.map"
    - "!node_modules/onnxruntime-node/bin/napi-v6/linux/**/*"
    - "!node_modules/onnxruntime-node/bin/napi-v6/darwin/**/*"
    - "!node_modules/onnxruntime-node/bin/napi-v6/win32/!(${arch})/**/*"
    - "!node_modules/onnxruntime-node/script/**/*"
    - "!node_modules/tesseract.js-core/tesseract-core.js"
    - "!node_modules/tesseract.js-core/tesseract-core.wasm*"
    - "!node_modules/tesseract.js-core/tesseract-core-simd.js"
    - "!node_modules/tesseract.js-core/tesseract-core-simd.wasm*"
    - "!node_modules/tesseract.js-core/tesseract-core-relaxedsimd.js"
    - "!node_modules/tesseract.js-core/tesseract-core-relaxedsimd.wasm*"
    - "!node_modules/tesseract.js-core/*-lstm.wasm.js"
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: BillFlow
  include: build/installer.nsh
mac:
  bundleVersion: "3"
  entitlements: build/entitlements.mac.plist
  extendInfo:
    NSAppleEventsUsageDescription: "BillFlow uses Apple Calendar automation when you choose to connect Calendar."
  files:
    - dist-electron/**/*
    - out/**/*
    - package.json
    - "!dist-electron/**/*.map"
    - "!node_modules/better-sqlite3/{deps,src,build}/**/*"
    - "!node_modules/better-sqlite3/binding.gyp"
    - "!node_modules/node-addon-api/**/*"
    - "!node_modules/better-sqlite3/prebuilds/!(darwin-${arch}).node"
    - "!node_modules/onnxruntime-web/**/*"
    - "!node_modules/@huggingface/transformers/{src,types}/**/*"
    - "!node_modules/@huggingface/transformers/dist/transformers.web.*"
    - "!node_modules/@huggingface/transformers/dist/*.map"
    - "!node_modules/onnxruntime-node/bin/napi-v6/linux/**/*"
    - "!node_modules/onnxruntime-node/bin/napi-v6/win32/**/*"
    - "!node_modules/onnxruntime-node/bin/napi-v6/darwin/!(${arch})/**/*"
    - "!node_modules/onnxruntime-node/bin/napi-v6/darwin/arm64/libonnxruntime.1.*.dylib"
    - "!node_modules/onnxruntime-node/script/**/*"
    - "!node_modules/tesseract.js-core/tesseract-core.js"
    - "!node_modules/tesseract.js-core/tesseract-core.wasm*"
    - "!node_modules/tesseract.js-core/tesseract-core-simd.js"
    - "!node_modules/tesseract.js-core/tesseract-core-simd.wasm*"
    - "!node_modules/tesseract.js-core/tesseract-core-relaxedsimd.js"
    - "!node_modules/tesseract.js-core/tesseract-core-relaxedsimd.wasm*"
    - "!node_modules/tesseract.js-core/*-lstm.wasm.js"
  icon: build/icon.icns
  target:
    - dmg
  category: public.app-category.finance
dmg:
  title: "BillFlow ${version}"
  icon: build/icon.icns
  background: build/dmg-background.png
  iconSize: 128
  iconTextSize: 13
  contents:
    - x: 162
      y: 220
    - x: 498
      y: 220
      type: link
      path: /Applications
